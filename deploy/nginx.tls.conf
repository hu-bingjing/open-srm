limit_req_zone $binary_remote_addr zone=authentication:10m rate=5r/s;
server {
    listen 8080;
    server_name _;
    location ~ (^|/)\. { return 404; }
    location ~ ^/(private|backup|backups|tmp|secrets|actuator)(/|$) { return 404; }
    location = /healthz { access_log off; return 200 'ok'; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=86400" always;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location ~ (^|/)\. { return 404; }
    location ~ ^/(private|backup|backups|tmp|secrets|actuator)(/|$) { return 404; }
    location = /healthz { access_log off; return 200 'ok'; }
    location ~ ^/api/v1/auth/(login|bootstrap)$ {
        limit_req zone=authentication burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
    }
    location /api/ { proxy_pass http://api:8080; proxy_set_header Host $http_host; }
    location / { try_files $uri $uri/ /index.html; }
}
