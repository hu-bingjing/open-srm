# Test HTTPS with a private certificate. Database and API remain unpublished.
services:
  api:
    environment:
      OPEN_SRM_ENV: test
      OPEN_SRM_COOKIE_SECURE: 'true'
  web:
    ports:
      - '${OPEN_SRM_TLS_BIND:-0.0.0.0}:${OPEN_SRM_TLS_PORT:-443}:8443'
    volumes:
      - ./nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ../private/tls:/etc/nginx/tls:ro
