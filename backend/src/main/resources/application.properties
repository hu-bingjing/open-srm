spring.application.name=OpenSRM
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.config.import=optional:configtree:/run/secrets/
spring.datasource.url=${OPEN_SRM_DB_URL:jdbc:postgresql://localhost:5432/open_srm}
spring.datasource.username=${OPEN_SRM_DB_USER:opensrm}
spring.datasource.password=${OPEN_SRM_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.servlet.session.cookie.name=OPEN_SRM_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${OPEN_SRM_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
server.compression.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
opensrm.environment=${OPEN_SRM_ENV:production}
opensrm.bootstrap-token=${OPEN_SRM_BOOTSTRAP_TOKEN:}
opensrm.idempotency-key=${OPEN_SRM_IDEMPOTENCY_KEY:}
opensrm.erp-adapter=${OPEN_SRM_ERP_ADAPTER:mock}
opensrm.erp-write-enabled=${OPEN_SRM_ERP_WRITE_ENABLED:false}

opensrm.sap.config=${OPEN_SRM_SAP_CONFIG:}
